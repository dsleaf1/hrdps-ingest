name: HRDPS ingest

on:
  schedule:
    - cron: "5 5,11,17,23 * * *"     # continental 2.5 km, 4x/day (~1h after 00/06/12/18Z)
    - cron: "20 7,19 * * *"          # west 1 km nest, 2x/day (~7h after 00/12Z)
  workflow_dispatch:
    inputs:
      model:
        description: "continental (2.5 km) or hrdps_west (1 km)"
        type: choice
        options: [continental, hrdps_west]
        default: continental
      mode:
        description: "full = decode + upload to R2 ; test = decode 3 h, no upload"
        type: choice
        options: [full, test]
        default: full

concurrency:
  group: hrdps-ingest-${{ github.event.schedule || github.event.inputs.model }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eccodes (GRIB2 decoder)
        run: sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-dev
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Continental 2.5 km (full → R2)
        if: ${{ github.event.schedule == '5 5,11,17,23 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' && github.event.inputs.model == 'continental') }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ingest.py --model continental

      - name: West 1 km (full → R2)
        if: ${{ github.event.schedule == '20 7,19 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' && github.event.inputs.model == 'hrdps_west') }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ingest.py --model hrdps_west

      - name: Test (decode only, no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        run: python ingest.py --model ${{ github.event.inputs.model }} --no-upload --max-hours 3 --regions haida-gwaii,coast-overview,north-passage,whole-coast

      - name: Report test result (as annotations)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open("out/manifest.json"))
          print(f"::notice title=run::{m['run']} hours={len(m['hours'])}")
          for k, r in m["regions"].items():
              n = r["cols"] * r["rows"]
              b = open(f"out/{r['file']}", "rb").read()
              v = [x for x in b[:n] if x != 255]
              print(f"::notice title=wind {k}::{r['cols']}x{r['rows']} bbox {r['bbox']}: {len(v)}/{n} cells with data, h0 km/h max={max(v) if v else '-'}")
              # coverage by latitude band (rows are north->south)
              W, S, E, N = r["bbox"]
              bands = []
              for lat0 in range(int(S), int(N) + 1):
                  rows_ = [i for i in range(r["rows"]) if lat0 <= N - i * (N - S) / (r["rows"] - 1) < lat0 + 1]
                  if not rows_: continue
                  tot = sum(1 for i in rows_ for c in range(r["cols"]))
                  ok = sum(1 for i in rows_ for c in range(r["cols"]) if b[i * r["cols"] + c] != 255)
                  bands.append(f"{lat0}N:{100*ok//tot}%")
              print(f"::notice title=coverage {k}::" + " ".join(bands))
          g = m.get("gust")
          if not g:
              print("::warning title=gust::no gust in manifest (label not found on Datamart)")
          else:
              for k, f in g["regions"].items():
                  b = open("out/" + f, "rb").read()
                  n = m["regions"][k]["cols"] * m["regions"][k]["rows"]
                  for h in range(len(m["hours"])):
                      v = [x for x in b[h*n:(h+1)*n] if x != 255]
                      s = f"{len(v)}/{n} valid, km/h max={max(v)} mean={sum(v)/len(v):.0f}" if v else "all nodata"
                      print(f"::notice title=gust {g['label']} {k} h{h}::{s}")
          PY

      - name: Upload test output
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        uses: actions/upload-artifact@v4
        with:
          name: hrdps-test-${{ github.event.inputs.model }}
          path: out/
